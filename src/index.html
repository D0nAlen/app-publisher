<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="styles/main.css" rel="stylesheet">
    <title>APP-publisher</title>
</head>

<body>
    <div class="wrapper">
        <header class="header">
            <div class="header__logo">
                <p>APP</p>
                <p class="header__logo_publisher">-publisher</p>
            </div>

            <div class="header__menu">
                <a>Услуги</a>
                <a>Проекты</a>
                <a>Компания</a>
                <a>Контакты</a>
                <a>Обучение</a>
            </div>

            <button class="page__button">Оставить заявку</button>
            <button class="header_ru__button">RU</button>
        </header>

        <section class="first-screen">
            <h1>Продвигаем и издаём игры и приложения</h1>

            <p class="first-screen_text">Тщательно анализируем результаты,
                грамотно поддерживаем в развитии и монетизизации
                вашего продукта</p>

            <button class="first-screen__button page__button">Узнать стоимость</button>
            <button>
                <img src="IMG/promo_icon.svg" alt="promo_icon" />
                Смотреть промо
            </button>
            <img src="IMG/first-screen_1.png" alt="first-screen_1">
        </section>
    </div>
</body>

</html>
